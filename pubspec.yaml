name: weather_outfit
description: Hava durumuna göre kombin öneren uygulama
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  geolocator: ^13.0.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  flutter_local_notifications: ^17.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  screenshot: ^3.0.0
  image_picker: ^1.2.1
  app_links: ^6.3.3
  url_launcher: ^6.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A3A4A"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true